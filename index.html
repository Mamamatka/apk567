  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 60px 25px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-icon {
      width: 130px;
      height: 130px;
      background: linear-gradient(180deg, #0b5ed7 0%, #0040a8 100%);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 42px;
      font-weight: 800;
      box-shadow: 0 15px 30px rgba(11, 94, 215, 0.25);
      margin-bottom: 25px;
    }

    .app-name {
      font-size: 36px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 35px;
      letter-spacing: -0.5px;
    }

    .download-btn {
      width: 100%;
      background-color: #0056e0;
      color: #ffffff;
      text-decoration: none;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      display: block;
      box-shadow: 0 8px 20px rgba(0, 86, 224, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .download-btn:active {
      transform: scale(0.98);
      background-color: #0044b3;
    }
