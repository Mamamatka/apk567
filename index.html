<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 50px 25px 35px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-icon {
      width: 130px;
      height: 130px;
      background: linear-gradient(180deg, #0b5ed7 0%, #0040a8 100%);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 42px;
      font-weight: 800;
      box-shadow: 0 15px 30px rgba(11, 94, 215, 0.25);
      margin-bottom: 25px;
    }

    .app-name {
      font-size: 36px;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 35px;
      letter-spacing: -0.5px;
    }

    .download-btn {
      width: 100%;
      background-color: #0056e0;
      color: #ffffff;
      text-decoration: none;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      display: block;
      box-shadow: 0 8px 20px rgba(0, 86, 224, 0.3);
      transition: background-color 0.2s, transform 0.1s;
      margin-bottom: 25px;
    }

    .download-btn:active {
      transform: scale(0.98);
      background-color: #0044b3;
    }

    /* Social Buttons Container */
    .social-container {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      margin-bottom: 25px;
    }

    /* Base Styling for Support Buttons */
    .support-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease-in-out;
      animation: popupGlow 2.5s infinite ease-in-out;
    }

    .support-btn img {
      width: 20px;
      height: 20px;
    }

    /* WhatsApp Button Glow & Colors */
    .whatsapp-btn {
      background-color: #25D366;
    }

    /* Telegram Button Glow & Colors */
    .telegram-btn {
      background-color: #0088cc;
    }

    .support-btn:active {
      transform: scale(0.95);
    }

    /* Popup & Soft Pulse Glow Animation */
    @keyframes popupGlow {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
      100% {
        transform: scale(1);
      }
    }

    .whatsapp-btn {
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
    }

    .telegram-btn {
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
    }

    /* Disclaimer Text */
    .disclaimer {
      font-size: 12px;
      color: #666666;
      line-height: 1.5;
      background-color: #f8f9fa;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #e9ecef;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Blue App Icon Box -->
    <div class="app-icon">
      567
    </div>

    <!-- Title -->
    <h1 class="app-name">Mama567</h1>

    <!-- Original Download Link -->
    <a href="https://drive.google.com/file/d/1K6cJiFv0_kddxPGMNTY1whEIO9z29u8u/view?usp=drivesdk" class="download-btn" target="_blank">
      Download App
    </a>

    <!-- Support Buttons with Glow & Popup Animation -->
    <div class="social-container">
      <!-- WhatsApp Link -->
      <a href="YOUR_WHATSAPP_LINK_HERE" class="support-btn whatsapp-btn" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
        <span>Support</span>
      </a>

      <!-- Telegram Link -->
      <a href="YOUR_TELEGRAM_CHANNEL_LINK_HERE" class="support-btn telegram-btn" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
        <span>Support</span>
      </a>
    </div>

    <!-- Hindi Disclaimer -->
    <div class="disclaimer">
      ⚠️ **ध्यान दें:** अगर ऐप डाउनलोड करने में कोई भी परेशानी आती है, तो आप WhatsApp या Telegram पर मैसेज कर सकते हैं।
    </div>
  </div>

</body>
</html>
